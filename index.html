<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6WK64SC1B2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-6WK64SC1B2');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Horizon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- These are only used as CSS background-images on elements inside the
     initially-hidden #screen-scene, so browsers won't fetch them until that
     screen becomes active. Preload them up front so they're already cached
     by the time gameplay starts, instead of popping in mid-scene. -->
  <link rel="preload" as="image" href="./assets/characters/sam_walk.png">
  <link rel="preload" as="image" href="./assets/characters/jerry_walk.png">
  <link rel="preload" as="image" href="./assets/characters/player.png">
</head>

<body>
  <div id="game-wrapper">
    <div id="game" style="width:320px;height:180px;">

      <!-- SCREEN: TITLE -->
      <div id="screen-title" class="screen active">
        <div class="title-layer title-bg"></div>
        <div class="title-layer title-stars"></div>
        <div id="title-station" class="title-layer"></div>
        <div class="title-layer title-ui">
          <div id="title-text" class="title-fadein">
            <div class="title-main">EVENT<br>HORIZON</div>
            <div class="title-sub">Get this station back to its glory days.</div>
          </div>
          <div class="title-buttons">
            <button class="btn btn-purple" id="btn-start" tabindex="0">START</button>
            <button class="btn btn-purple" id="btn-settings" tabindex="0">SETTINGS</button>
            <button class="btn btn-purple" id="btn-instructions" tabindex="0">HOW TO PLAY</button>
          </div>
        </div>
        <!-- Auth UI (top-right corner) -->
        <div id="auth-corner">
          <button class="btn btn-purple" id="btn-sign-in" tabindex="0">SIGN IN</button>
          <div id="user-info" class="hidden">
            <img id="user-avatar" alt="">
            <span id="user-name"></span>
            <button class="btn btn-purple" id="btn-sign-out" tabindex="0">SIGN OUT</button>
          </div>
        </div>
      </div>

      <!-- SCREEN: CHARACTER SELECT -->
      <div id="screen-characters" class="screen">
        <div class="scenes-title">CHOOSE YOUR CHARACTER</div>
        <div id="characters-list">
          <button class="btn btn-purple character-btn" data-character="ester">
            <span class="character-portrait char-ester" aria-hidden="true"></span>
            <span class="character-info">
              <span class="character-name">ESTER</span>
              <span class="character-job">Nuclear Physicist</span>
            </span>
          </button>
          <button class="btn btn-purple character-btn" data-character="astro">
            <span class="character-portrait char-astro" aria-hidden="true"></span>
            <span class="character-info">
              <span class="character-name">ASTRO</span>
              <span class="character-job">Molecular Biologist</span>
            </span>
          </button>
          <button class="btn btn-purple character-btn" data-character="nina">
            <span class="character-portrait char-nina" aria-hidden="true"></span>
            <span class="character-info">
              <span class="character-name">NINA</span>
              <span class="character-job">Research Assistant</span>
            </span>
          </button>
        </div>
      </div>

      <!-- SCREEN: INTRO -->
      <div id="screen-intro" class="screen">
        <div id="intro-text" class="intro-text"></div>
        <div id="intro-counter" class="intro-counter"></div>
      </div>

      <!-- SCREEN: RECAP (scene-ending summary beats, styled like the intro cards) -->
      <div id="screen-recap" class="screen">
        <div id="recap-text" class="intro-text"></div>
      </div>

      <!-- SCREEN: SCENE SELECT (hub between scenes — only the next unplayed scene is clickable) -->
      <div id="screen-scenes" class="screen">
        <div class="scenes-title">SELECT SCENE</div>
        <div id="scenes-list"></div>
      </div>

      <!-- HUD BUTTONS (visible during intro / scene) -->
      <div id="hud-buttons" class="hidden">
        <button id="btn-map" class="btn btn-purple" tabindex="0" aria-label="Station Map">MAP</button>
        <button id="btn-pause" class="btn btn-purple" tabindex="0" aria-label="Pause / Settings">II</button>
      </div>

      <!-- SCREEN: SCENE -->
      <div id="screen-scene" class="screen">
        <div id="scene-world">
          <!-- Aerospace engineering department (Scene 4), west of the lab. Hidden until
             Scene 4 reveals it, so it can't peek into view during earlier scenes' camera pans.
             aerospace_room.jpg is a resized/recompressed export of the full source art (full
             content, nothing spatially cropped out of the file) — see #aerospace-bg in style.css
             for the CSS zoom/position that isolates the ground floor, same as #scene-main-bg and
             #scene-bg below. -->
          <img id="aerospace-bg" class="hidden" src="./assets/rooms/aerospace_room.jpg" alt="">
          <img id="scene-main-bg" src="./assets/rooms/main_room.jpg" alt="">
          <!-- The lift between the main room's ground floor and its mezzanine
               (see #scene-main-bg.floor2 in style.css) — sized/positioned by
               script.js (LIFT_X/LIFT_WIDTH), sitting on the darker wall panel
               already painted into main_room.jpg. Pressing E on it (see
               tryUseLift in script.js) toggles #scene-main-bg's .floor2
               class to switch floors. -->
          <img id="lift-platform" class="lift-prop" src="./assets/ui/lift.png" alt="">
          <img id="scene-bg" src="./assets/rooms/nuclear_room.jpg" alt="">
          <div id="scene-sprite-sam" class="scene-sprite facing-left" data-char="sam"></div>
          <div id="scene-sprite-jerry" class="scene-sprite hidden" data-char="jerry"></div>
          <div id="scene-sprite-ester" class="scene-sprite" data-char="ester"></div>
          <div id="scene-sprite-cameron" class="scene-sprite hidden" data-char="cameron"></div>
        </div>
        <!-- Walk hint: shown while free-roaming toward a destination in a
             different room than the one Ester is currently standing in. -->
        <div id="walk-hint" class="hidden">
          <span id="walk-hint-arrow">→</span>
          <span id="walk-hint-text"></span>
        </div>
        <!-- Lift hint: shown only while Ester is standing on the lift's own
             footprint (see LIFT_MIN_X/MAX_X and updateLiftHint in script.js) —
             pressing E there is otherwise undiscoverable. -->
        <div id="lift-hint" class="hidden">Press <span id="lift-hint-key">E</span> to use the lift</div>
        <div id="dialogue-row" class="hidden">
          <div id="dialogue-portrait" class="hidden"></div>
          <div id="dialogue-col">
            <div id="dialogue-speaker"></div>
            <div id="dialogue-box">
              <p id="dialogue-text"></p>
            </div>
          </div>
        </div>
        <div id="choice-panel" class="hidden"></div>
        <div id="room-fade"></div>
      </div>

      <!-- SCREEN: SENSORY MINIGAME -->
      <div id="screen-minigame" class="screen">
        <iframe id="minigame-frame" title="Sensory Overload Mini-Game"></iframe>
      </div>

      <!-- SCREEN: END -->
      <div id="screen-end" class="screen">
        <div class="end-inner">
          <div id="end-reflection" class="hidden"></div>
          <div class="end-buttons hidden" id="end-buttons">
            <button class="btn btn-purple" id="btn-restart">RESTART</button>
          </div>
        </div>
      </div>

      <!-- SETTINGS OVERLAY -->
      <div id="settings-overlay" class="overlay hidden">
        <div id="settings-panel">
          <div class="settings-title">SETTINGS</div>
          <label class="settings-row">
            <input type="checkbox" id="chk-dyslexia">
            <span>Dyslexic-friendly font</span>
          </label>
          <label class="settings-row">
            <input type="checkbox" id="chk-large-text">
            <span>Larger text</span>
          </label>
          <label class="settings-row">
            <input type="checkbox" id="chk-instant-text">
            <span>Instant text (skip typewriter)</span>
          </label>
          <label class="settings-row">
            <input type="checkbox" id="chk-reduce-flashing">
            <span>Reduce flashing &amp; screen shake</span>
          </label>
          <button class="btn btn-purple" id="btn-settings-instructions">HOW TO PLAY</button>
          <button class="btn btn-purple" id="btn-settings-close">CLOSE</button>
          <button class="btn btn-purple" id="btn-back-to-menu">BACK TO MENU</button>
          <button class="btn btn-purple" id="btn-pause-restart">RESTART</button>
        </div>
      </div>

      <!-- MAP OVERLAY -->
      <div id="map-overlay" class="overlay hidden">
        <div id="map-panel">
          <div class="settings-title">STATION MAP</div>
          <img id="map-image" src="./assets/ui/map.png" alt="Map of the research station">
          <button class="btn btn-purple" id="btn-map-close">CLOSE</button>
        </div>
      </div>

      <!-- INSTRUCTIONS OVERLAY -->
      <div id="instructions-overlay" class="overlay hidden">
        <div id="instructions-panel">
          <div class="settings-title">HOW TO PLAY</div>
          <div class="instructions-row"><span class="instructions-keys">← → / A D</span><span>Move</span></div>
          <div class="instructions-row"><span class="instructions-keys">SPACE / ENTER</span><span>Advance text (or
              click)</span></div>
          <div class="instructions-row"><span class="instructions-keys">CLICK</span><span>Choose an option</span></div>
          <div class="instructions-row"><span class="instructions-keys">P / II</span><span>Pause / settings</span></div>
          <div class="instructions-row"><span class="instructions-keys">M</span><span>Open station map</span></div>
          <div class="instructions-row"><span class="instructions-keys">E</span><span>Use the lift</span></div>
          <button class="btn btn-purple" id="btn-instructions-close">CLOSE</button>
        </div>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>

</html>
