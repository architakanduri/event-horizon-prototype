<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sensory Test — Event Horizon</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{ --yellow:#ffd700; --lyellow:#ffe87c; --purple:#2a1a6e; --sx:0px; --sy:0px; --bx:0px; --by:0px; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Press Start 2P',monospace;image-rendering:pixelated;
}
#game-wrapper{ image-rendering:pixelated;transform-origin:center center;position:relative; }

/* Game container — does NOT shake */
#game{ position:relative;width:320px;height:180px;overflow:hidden;background:#05000e; }

/* Background — oversized so shake never reveals edges */
#sensory-bg{
  position:absolute;width:116%;height:116%;top:-8%;left:-8%;
  background:#1a0008;animation:bgFlashIntro 3s infinite;
}
@keyframes bgFlashIntro{ 0%,100%{background:rgba(18,0,7,1);} 50%{background:rgba(30,0,10,.85);} }
@keyframes bgFlash{ 0%,100%{background:rgba(40,0,12,1);} 50%{background:rgba(180,0,40,.85);} }
@keyframes bgFlashCalm{ 0%,100%{background:rgba(20,0,8,1);} 50%{background:rgba(55,0,18,.75);} }
/* #game shakes at reduced intensity (text stays readable) */
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(calc(var(--sx)*-1),var(--sy))}
  30%{transform:translate(var(--sx),calc(var(--sy)*-1))}
  45%{transform:translate(calc(var(--sx)*-.7),calc(var(--sy)*-.8))}
  60%{transform:translate(var(--sx),var(--sy))}
  75%{transform:translate(calc(var(--sx)*-.9),0)}
  90%{transform:translate(calc(var(--sx)*.6),calc(var(--sy)*-.5))}
}
/* #sensory-bg shakes at higher intensity using separate vars */
@keyframes shake-bg{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(calc(var(--bx)*-1),var(--by))}
  30%{transform:translate(var(--bx),calc(var(--by)*-1))}
  45%{transform:translate(calc(var(--bx)*-.7),calc(var(--by)*-.8))}
  60%{transform:translate(var(--bx),var(--by))}
  75%{transform:translate(calc(var(--bx)*-.9),0)}
  90%{transform:translate(calc(var(--bx)*.6),calc(var(--by)*-.5))}
}

/* Shared overlay box */
.overlay-box{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
  z-index:20;background:rgba(8,2,32,.97);border:1px solid var(--yellow);
  padding:10px 12px;width:268px;
  display:flex;flex-direction:column;gap:7px;
  opacity:1;transition:opacity .3s;
}
/* Interject sits outside #game so it never shakes */
#interject{ z-index:50; }
.overlay-box.hidden{ opacity:0;pointer-events:none; }
.overlay-header{ font-family:'Arial',monospace;font-size:6px;color:var(--yellow);letter-spacing:1px;text-align:center; }
.overlay-body{ font-family:'Arial',monospace;font-size:5px;color:#ddd;line-height:2;min-height:32px; }
.overlay-hint{ font-family:'Arial',monospace;font-size:4px;color:var(--yellow);text-align:center;opacity:0;transition:opacity .4s;margin-top:2px; }
.overlay-hint.visible{ opacity:1; }

/* Calibration panel */
#sensory-panel{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:10;display:flex;flex-direction:column;align-items:center;
  gap:5px;padding:10px;
  background:rgba(16,6,122,.92);border:2px solid var(--yellow);width:276px;
  opacity:0;transition:opacity .45s;
}
#sensory-panel.visible{ opacity:1; }
#sensory-header{ font-family:'Arial',monospace;font-size:7px;color:var(--yellow);letter-spacing:1px; }
#sensory-db{ font-family:'Arial',monospace;font-size:13px;color:var(--lyellow); }
#sensory-instructions{ font-size:4px;color:var(--yellow);text-align:center;max-width:240px;line-height:1.6; }

#stress-row{ width:100%;display:flex;flex-direction:column;gap:2px;padding:3px 4px; }
#stress-label{ font-family:'Arial',monospace;font-size:4px;color:#f55;display:flex;justify-content:space-between; }
#stress-track{ width:200px;height:5px;background:rgba(100,0,0,.4);border:1px solid #600;align-self:center;overflow:hidden; }
#stress-fill{ height:100%;width:0%;background:linear-gradient(90deg,#4c4 0%,#fa0 50%,#f44 100%);background-size:200px 100%; }

.sensory-control{ width:100%;display:flex;flex-direction:column;gap:2px;padding:3px 4px;border:1px solid transparent; }
.sensory-control.selected{ border-color:var(--yellow); }
.sensory-control.locked{ border-color:#4c4; }
.sensory-control.locked .ctrl-label,.sensory-control.locked .ctrl-val{ color:#4c4; }
.sensory-control.in-range .ctrl-label{ color:#4c4; }
.sensory-control.in-range .ctrl-handle{ background:#4c4; }
.ctrl-label{ font-family:'Arial',monospace;font-size:4px;color:var(--purple); }
.ctrl-track{ position:relative;width:200px;height:8px;background:var(--purple);align-self:center; }
.ctrl-zone{ position:absolute;height:100%;background:rgba(0,180,0,.25);border-left:1px solid #0a0;border-right:1px solid #0a0;transition:left .1s linear,width .1s linear; }
.ctrl-handle{ position:absolute;width:6px;height:12px;top:-2px;background:var(--yellow); }
.ctrl-val{ font-family:'Arial',monospace;font-size:4px;color:var(--lyellow);text-align:right;width:200px;align-self:center; }
#sensory-hint{ font-family:'Arial',monospace;font-size:3px;color:var(--yellow);opacity:.7; }
#sensory-status{ font-family:'Arial',monospace;font-size:5px;color:#4c4;min-height:8px;text-align:center; }
#sensory-status.warning{ color:#f55; }

/* End overlay */
#end-overlay{
  position:absolute;inset:0;display:none;z-index:40;background:rgba(0,0,0,.78);
  flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
#end-overlay.visible{ display:flex; }
#end-title{ font-size:8px;color:var(--yellow);text-align:center;line-height:1.8;white-space:pre; }
#end-sub{ font-size:4px;color:rgba(255,215,0,.6);text-align:center; }
#end-retry{
  margin-top:4px;font-family:'Press Start 2P',monospace;font-size:5px;
  background:transparent;border:1px solid var(--yellow);color:var(--yellow);padding:4px 8px;cursor:pointer;
}
#end-retry:hover{ background:rgba(255,215,0,.15); }
#test-label{ font-family:'Press Start 2P',monospace;font-size:9px;color:rgba(255,215,0,.3);margin-bottom:12px;letter-spacing:2px; }
</style>
</head>
<body>

<div id="test-label">SENSORY TEST</div>
<div id="game-wrapper">
  <div id="game">
    <div id="sensory-bg"></div>

    <!-- PHASE 1: Explanation (calm, no chaos yet) -->
    <div id="explain" class="overlay-box">
      <div class="overlay-header">ATMOSPHERIC ALERT</div>
      <div class="overlay-body" id="explain-body"></div>
      <div class="overlay-hint" id="explain-hint">[ SPACE ] &nbsp; Continue</div>
    </div>

    <!-- PHASE 2: Calibration panel (visible from start of game) -->
    <div id="sensory-panel">
      <div id="sensory-header">REACTOR ALARM</div>
      <div id="sensory-db">96 dB</div>
      <div id="sensory-instructions">Calibration zones are shifting. Lock each before overload.</div>
      <div id="stress-row">
        <div id="stress-label"><span>STRESS LEVEL</span><span id="stress-val">0%</span></div>
        <div id="stress-track"><div id="stress-fill"></div></div>
      </div>
      <div class="sensory-control" id="ctrl-noise">
        <div class="ctrl-label">NOISE DAMPENER</div>
        <div class="ctrl-track">
          <div class="ctrl-zone" id="noise-zone"></div>
          <div class="ctrl-handle" id="noise-handle"></div>
        </div>
        <div class="ctrl-val" id="noise-val">0%</div>
      </div>
      <div class="sensory-control" id="ctrl-light">
        <div class="ctrl-label">LIGHT FILTER</div>
        <div class="ctrl-track">
          <div class="ctrl-zone" id="light-zone"></div>
          <div class="ctrl-handle" id="light-handle"></div>
        </div>
        <div class="ctrl-val" id="light-val">100%</div>
      </div>
      <div id="sensory-hint">W RAISE &nbsp; S LOWER &nbsp; SPACE LOCK</div>
      <div id="sensory-status"></div>
    </div>

    <div id="end-overlay">
      <div id="end-title"></div><div id="end-sub"></div>
      <button id="end-retry">RETRY</button>
    </div>
  </div>

  <!-- Interject lives outside #game so the shake animation never reaches it -->
  <div id="interject" class="overlay-box hidden">
    <div class="overlay-body" id="interject-body"></div>
    <div class="overlay-hint" id="interject-hint">[ SPACE ] &nbsp; Put them on</div>
  </div>
</div>

<script>
/* ---- CONSTANTS ---- */
const TRACK_W      = 200;
const STEP         = 6;
const NOISE_CENTER = 65; const NOISE_HALF = 15; const NOISE_SWING = 24; const NOISE_FREQ = .50;
const LIGHT_CENTER = 50; const LIGHT_HALF = 10; const LIGHT_SWING = 20; const LIGHT_FREQ = .44;

const EXPLAIN_TEXT =
  "A device containing elemental mercury has overturned near the ventilation intake. " +
  "The atmospheric alarm triggered automatically.\n\n" +
  "Noise and light readings are approaching hazardous levels. " +
  "The environmental systems need manual calibration before conditions become unmanageable.";

const INTERJECT_TEXT =
  "The alarm is deafening.\n\n" +
  "Your noise-canceling dampeners are on the desk — second drawer.";

/* ---- STATE ---- */
let noise, light, phase, isDone;
let stress, gameActive, startTime, lastTs;
let hasDampeners    = false;
let interjectShown  = false;   // true once the 95% interject has been triggered
let interjectActive = false;   // true while the interject overlay is open mid-game
let uiReady         = false;   // true once current typing is done and Space is accepted
let gameState       = "explain"; // "explain" | "calibrate"
let currentNoiseMin, currentNoiseMax, currentLightMin, currentLightMax;
let currentFlashDur = 3;
let warningTimer = null, typeTimer = null;

function $(id){ return document.getElementById(id); }

/* ================================================================
   INIT
================================================================ */
function init(){
  noise=0; light=100; phase=0; isDone=false;
  stress=0; gameActive=false; hasDampeners=false;
  interjectShown=false; interjectActive=false; uiReady=false;
  gameState="explain";

  $('sensory-status').textContent=''; $('sensory-status').className='';
  $('end-overlay').classList.remove('visible');
  $('explain').classList.remove('hidden');
  $('explain-body').textContent=''; $('explain-hint').classList.remove('visible');
  $('interject').classList.add('hidden');
  $('interject-body').textContent=''; $('interject-hint').classList.remove('visible');
  $('sensory-panel').classList.remove('visible');

  resetShake();
  currentFlashDur = 3;
  $('sensory-bg').style.animation = 'bgFlashIntro 3s infinite';
  $('sensory-db').textContent = '96 dB';

  currentNoiseMin = NOISE_CENTER - NOISE_HALF;
  currentNoiseMax = NOISE_CENTER + NOISE_HALF;
  currentLightMin = LIGHT_CENTER - LIGHT_HALF;
  currentLightMax = LIGHT_CENTER + LIGHT_HALF;
  updateZones(); render(); renderStress();

  clearTimeout(typeTimer);
  typeTimer = setTimeout(()=>{
    typeText($('explain-body'), EXPLAIN_TEXT, ()=>{
      uiReady = true;
      $('explain-hint').classList.add('visible');
    }, 8, 22);
  }, 500);
}

/* ================================================================
   START CALIBRATION (explanation dismissed)
================================================================ */
function startCalibration(){
  gameState = "calibrate";
  uiReady   = false;
  $('explain').classList.add('hidden');

  // Alarm onset — snap to full chaos immediately
  currentFlashDur = 1.4;
  $('sensory-bg').style.animation = `bgFlash ${currentFlashDur}s infinite`;

  // Fade in the calibration panel
  setTimeout(()=>{ $('sensory-panel').classList.add('visible'); }, 180);

  // Start game loop
  startTime = performance.now();
  lastTs    = startTime;
  gameActive = true;
  requestAnimationFrame(gameLoop);
}

/* ================================================================
   MID-GAME INTERJECT (fires at 95% stress)
================================================================ */
function triggerInterject(){
  interjectShown  = true;
  interjectActive = true;
  uiReady         = false;
  $('interject').classList.remove('hidden');
  clearTimeout(typeTimer);
  typeText($('interject-body'), INTERJECT_TEXT, ()=>{
    uiReady = true;
    $('interject-hint').classList.add('visible');
  });
}

function equipDampeners(){
  hasDampeners    = true;
  interjectActive = false;
  uiReady         = false;
  stress          = 0;   // full relief — stress resets
  $('interject').classList.add('hidden');
  $('interject-body').textContent='';
  $('interject-hint').classList.remove('visible');

  // Environment calms noticeably with dampeners on
  currentFlashDur = 1.8;
  resetShake();
  showStatus('Better. Now calibrate the environmental systems.', false);
}

/* ================================================================
   GAME LOOP
================================================================ */
function gameLoop(ts){
  if(!gameActive) return;
  const dt      = Math.min(ts - lastTs, 50) / 1000;
  lastTs        = ts;
  const elapsed = (ts - startTime) / 1000;

  // Trigger dampener interject at 95% stress (once)
  if(stress >= 80 && !interjectShown && !isDone){
    stress = 80; // pin exactly so interject fires clean
    triggerInterject();
  }

  // Stress: frozen while player reads the interject; much slower after dampeners on
  if(!interjectActive){
    const stressRate = hasDampeners
      ? 0.8                        // dampeners on: very slow creep
      : (phase >= 1 ? 5.5 : 9);   // no dampeners: full rate
    const cap = interjectShown ? 100 : 95;
    stress = Math.min(cap, stress + stressRate * dt);
  }

  // Value drift — continues even during interject (sliders keep moving under the popup)
  const driftRate = 1.8 + stress * 0.09;
  if(phase === 0) noise = Math.max(0,   noise - driftRate * dt);
  if(!isDone)     light = Math.min(100, light + driftRate * dt);

  // Zone oscillation (4 s grace, then speeds with stress)
  const oscE     = Math.max(0, elapsed - 4);
  const speedMul = 1 + (stress / 100) * 0.9;
  const nCtr = NOISE_CENTER + Math.sin(oscE * NOISE_FREQ * speedMul) * NOISE_SWING;
  const lCtr = LIGHT_CENTER + Math.sin(oscE * LIGHT_FREQ * speedMul + 2.1) * LIGHT_SWING;
  currentNoiseMin = nCtr - NOISE_HALF; currentNoiseMax = nCtr + NOISE_HALF;
  currentLightMin = lCtr - LIGHT_HALF; currentLightMax = lCtr + LIGHT_HALF;
  updateZones();

  renderStress();
  applyStressEffects();
  render();

  if(stress >= 100 && !isDone){ triggerFail(); return; }
  requestAnimationFrame(gameLoop);
}

/* ================================================================
   INPUT
================================================================ */
function onKey(e){
  if(e.key === ' '){
    e.preventDefault();

    // Phase 1 → 2: dismiss explanation
    if(gameState === 'explain' && uiReady){ startCalibration(); return; }

    // Mid-game interject: equip dampeners
    if(interjectActive && uiReady){ equipDampeners(); return; }

    // Calibration: lock sliders
    if(gameState === 'calibrate' && !interjectActive && !isDone){
      if(phase === 0){
        if(noise >= currentNoiseMin && noise <= currentNoiseMax){
          phase = 1;
          showStatus('NOISE DAMPENED — now lock the light filter', false);
        } else {
          stress = Math.min(100, stress + 7);
          showWarning('Noise level out of range. Adjust using [W/S] before locking.');
        }
      } else {
        if(light >= currentLightMin && light <= currentLightMax){
          triggerSuccess();
        } else {
          stress = Math.min(100, stress + 7);
          showWarning('Light level out of range. Adjust using [W/S] before locking.');
        }
      }
      render();
    }
    return;
  }

  // W/S only work during calibration and not while interject is open
  if(gameState !== 'calibrate' || interjectActive || isDone) return;
  const up = e.key==='w'||e.key==='W';
  const dn = e.key==='s'||e.key==='S';
  if(up||dn){
    e.preventDefault();
    const delta = up ? STEP : -STEP;
    if(phase===0) noise = Math.min(100, Math.max(0, noise + delta));
    else          light = Math.min(100, Math.max(0, light + delta));
    render();
  }
}

/* ================================================================
   SHAKE — #game shakes at 38% intensity (text readable but feels the stress)
            #sensory-bg shakes at 62% MORE (total bg movement = 100%)
================================================================ */
function applyStressEffects(){
  const flashMin = hasDampeners ? 0.55 : 0.16;
  const flashMax = hasDampeners ? 2.2  : 1.40;
  currentFlashDur = +(flashMax - (stress / 100) * (flashMax - flashMin)).toFixed(2);

  const threshold = hasDampeners ? 42 : 25;
  const maxPx     = hasDampeners ? 1.8 : 4.5;
  const root      = document.documentElement;
  const bg        = $('sensory-bg');
  const game      = $('game');
  const anim      = hasDampeners ? 'bgFlashCalm' : 'bgFlash';

  if(stress < threshold){
    root.style.setProperty('--sx','0px'); root.style.setProperty('--sy','0px');
    root.style.setProperty('--bx','0px'); root.style.setProperty('--by','0px');
    game.style.animation = 'none';
    bg.style.animation   = `${anim} ${currentFlashDur}s infinite`;
    return;
  }
  const t      = (stress - threshold) / (100 - threshold);
  const totalPx = maxPx * t;
  const gamePx  = +(totalPx * 0.38).toFixed(1); // text shakes at 38%
  const bgPx    = +(totalPx * 0.62).toFixed(1); // bg shakes an extra 62%
  const spd     = Math.round(500 - t * (hasDampeners ? 360 : 445));

  root.style.setProperty('--sx', gamePx + 'px');
  root.style.setProperty('--sy', (gamePx * 0.55).toFixed(1) + 'px');
  root.style.setProperty('--bx', bgPx + 'px');
  root.style.setProperty('--by', (bgPx * 0.55).toFixed(1) + 'px');

  game.style.animation = `shake ${spd}ms linear infinite`;
  bg.style.animation   = `${anim} ${currentFlashDur}s infinite, shake-bg ${spd}ms linear infinite`;
}

function resetShake(){
  const root = document.documentElement;
  root.style.setProperty('--sx','0px'); root.style.setProperty('--sy','0px');
  root.style.setProperty('--bx','0px'); root.style.setProperty('--by','0px');
  $('game').style.animation = 'none';
  const anim = hasDampeners ? 'bgFlashCalm' : 'bgFlash';
  $('sensory-bg').style.animation = `${anim} ${currentFlashDur}s infinite`;
}

/* ================================================================
   WIN / FAIL
================================================================ */
function triggerSuccess(){
  isDone=true; gameActive=false;
  clearTimeout(warningTimer);
  resetShake();
  currentFlashDur = 3;
  $('sensory-bg').style.animation = 'bgFlashCalm 3s infinite';
  showStatus('ENVIRONMENT NORMALIZED', false);
  render();
  setTimeout(()=>{
    $('end-title').textContent = 'SYSTEMS\nSTABILIZED';
    $('end-title').style.color = '#4c4';
    $('end-sub').textContent   = 'Ester takes a slow breath.';
    $('end-overlay').classList.add('visible');
  }, 900);
}

function triggerFail(){
  isDone=true; gameActive=false;
  clearTimeout(warningTimer);
  $('interject').classList.add('hidden');
  const root = document.documentElement;
  root.style.setProperty('--sx','2px'); root.style.setProperty('--sy','1.1px');
  root.style.setProperty('--bx','4px'); root.style.setProperty('--by','2.2px');
  $('game').style.animation      = 'shake 55ms linear infinite';
  $('sensory-bg').style.animation = 'bgFlash .1s infinite, shake-bg 55ms linear infinite';
  setTimeout(()=>{
    resetShake();
    $('sensory-bg').style.animation = 'bgFlash 1.4s infinite';
    $('end-title').textContent = 'SYSTEM\nOVERLOAD';
    $('end-title').style.color = '#f55';
    $('end-sub').textContent   = 'Sensory overload. Try again.';
    $('end-overlay').classList.add('visible');
  }, 650);
}

/* ================================================================
   STATUS
================================================================ */
function showStatus(msg, isWarn){
  clearTimeout(warningTimer);
  const el = $('sensory-status');
  el.textContent = msg; el.className = isWarn ? 'warning' : '';
  if(isWarn) warningTimer = setTimeout(()=>{ el.textContent=''; el.className=''; }, 2000);
}
function showWarning(msg){ showStatus(msg, true); }

/* ================================================================
   ZONE / RENDER
================================================================ */
function updateZones(){
  $('noise-zone').style.left  = (currentNoiseMin / 100 * TRACK_W) + 'px';
  $('noise-zone').style.width = ((currentNoiseMax - currentNoiseMin) / 100 * TRACK_W) + 'px';
  $('light-zone').style.left  = (currentLightMin / 100 * TRACK_W) + 'px';
  $('light-zone').style.width = ((currentLightMax - currentLightMin) / 100 * TRACK_W) + 'px';
}

function render(){
  $('noise-handle').style.left = (noise / 100 * TRACK_W - 3) + 'px';
  $('light-handle').style.left = (light / 100 * TRACK_W - 3) + 'px';
  const nL=phase>=1, lL=isDone;
  $('noise-val').textContent = nL ? 'LOCKED ✓' : Math.round(noise) + '%';
  $('light-val').textContent = lL ? 'LOCKED ✓' : Math.round(light) + '%';
  const nc=$('ctrl-noise'), lc=$('ctrl-light');
  nc.classList.toggle('selected',phase===0); nc.classList.toggle('locked',nL);
  lc.classList.toggle('selected',phase===1); lc.classList.toggle('locked',lL);
  nc.classList.toggle('in-range', noise>=currentNoiseMin && noise<=currentNoiseMax && !nL);
  lc.classList.toggle('in-range', light>=currentLightMin && light<=currentLightMax && !lL);
}

function renderStress(){
  const pct = Math.round(stress);
  $('stress-fill').style.width = pct + '%';
  $('stress-val').textContent  = pct + '%';
  $('sensory-db').textContent  = Math.round(76 + stress * 0.22) + ' dB';
}

/* ================================================================
   TYPEWRITER
================================================================ */
function typeText(el, text, onDone, charMs, punctMs){
  clearTimeout(typeTimer);
  el.textContent = '';
  const chars = [...text];
  const cd = charMs  ?? 34;
  const pd = punctMs ?? 80;
  let i = 0;
  function tick(){
    if(i >= chars.length){ if(onDone) onDone(); return; }
    const ch = chars[i++];
    if(ch==='\n' && chars[i]==='\n'){
      el.appendChild(document.createElement('br'));
      el.appendChild(document.createElement('br'));
      i++;
    } else {
      el.appendChild(document.createTextNode(ch));
    }
    typeTimer = setTimeout(tick, ch==='.'||ch===','||ch==='—' ? pd : cd);
  }
  tick();
}

/* ================================================================
   SCALE & BOOT
================================================================ */
function scaleGame(){
  const s = Math.min((window.innerWidth-32)/320,(window.innerHeight-80)/180);
  $('game-wrapper').style.transform = 'scale('+Math.max(1,s)+')';
}
window.addEventListener('resize', scaleGame);
scaleGame();

$('end-retry').addEventListener('click', restart);
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && $('end-overlay').classList.contains('visible')){ restart(); return; }
  onKey(e);
});

function restart(){
  clearTimeout(typeTimer); clearTimeout(warningTimer);
  init();
}

init();
</script>
</body>
</html>
